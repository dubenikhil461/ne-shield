services:
  db:
    image: postgis/postgis:16-3.4
    container_name: landslide_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: landslide_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
